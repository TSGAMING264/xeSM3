; ============================================================
; xeSM3 - Spider-Man 3 PC Loose Resource Mod Loader
; Created by TSGAMING264
; Public Release: v0.1.0
; ============================================================
;
; On game startup, every enabled mod directory listed under
; [EnabledMods] is scanned recursively for loose replacement files.
;
; xeSM3 uses the original Spider-Man 3 archive structure:
;
;   Mods\<Mod Name>\<PACK>\<APKF>\<resource>
;
; Examples:
;
;   Mods\My Character Mod\CH_SPIDERMAN\_O0069.0xCFB154CD.T36.apkf\0xAC92103D.ch_spiderman000.mesh
;
;   Mods\My Loading Screen\SPIDERMANLOGO\_O0001.0x348E72F4.T36.apkf\0xDEF62318.i_loading_screen_bkg.tex
;
; Supported loose resource types:
;
;   MESH
;   MAT
;   TEX
;   ANIM
;   SKEL
;   ASKL
;
; Reference catalogs:
;
;   filelist.txt
;   filelist.apkf.txt
;   filelist.apkf.paths.txt
;
; ============================================================
; MOD ENABLE / DISABLE VALUES
; ============================================================
;
; xeSM3 intentionally uses only two values:
;
;   0   = Disabled
;   100 = Enabled
;
; Other numeric priority values are NOT supported.
; The name on the left must exactly match the mod folder under Mods\.
;
; Example:
;
;   My First Mod=100
;   Disabled Mod=0
;
